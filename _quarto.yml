project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
  resources:
    - "Lectures/**/*.pdf"

website:
  title: "Applied Data Science with Python"
  description: "CS 4622/5622 - Applied Data Science with Python, University of Idaho, Fall 2026"
  site-url: https://avakanski.github.io/Fall-2026-Applied-Data-Science-with-Python/
  repo-url: https://github.com/avakanski/Fall-2026-Applied-Data-Science-with-Python
  page-navigation: true
  sidebar:
    style: docked
    background: "#D9E3E4"
    pinned: true
    align: center
    search: true
    collapse-level: 2
    tools:
      - icon: github
        href: https://github.com/avakanski/Fall-2026-Applied-Data-Science-with-Python
        text: GitHub repository
    contents:
      - section: "Course Information"
        href: index.qmd
        contents:
          - href: index.qmd#course-syllabus
            text: "Syllabus"
          - href: index.qmd#course-description
            text: "Course Description"
          - href: index.qmd#textbooks
            text: "Textbooks"
          - href: index.qmd#learning-outcomes
            text: "Learning Outcomes"
          - href: index.qmd#prerequisites
            text: "Prerequisites"
          - href: index.qmd#grading
            text: "Grading"
          - href: index.qmd#course-schedule
            text: "Course Schedule"
      - href: Lectures/Lecture_1-A_Short_History_of_AI/Lecture_1-A_Short_History_of_AI.qmd
        text: "Lecture 1 - A Short History of AI"
      - section: "Theme 1 - Python Programming"
        contents:
          - href: "Lectures/Theme_1-Python_Programming/Lecture_2-Python_Data_Types,_Statements/Lecture_2-Python_Data_Types,_Statements.ipynb"
            text: "Lecture 2 - Python Data Types, Statements"
          - href: "Lectures/Theme_1-Python_Programming/Lecture_3-Files,_Functions/Lecture_3-Files,_Functions.ipynb"
            text: "Lecture 3 - Files, Functions"
          - href: "Lectures/Theme_1-Python_Programming/Lecture_4-OOP,_Modules,_Packages/Lecture_4-OOP,_Modules,_Packages.ipynb"
            text: "Lecture 4 - OOP, Modules, Packages"
      - section: "Theme 2 - Data Engineering Pipelines"
        contents:
          - href: "Lectures/Theme_2-Data_Engineering/Lecture_5-NumPy/Lecture_5-NumPy.ipynb"
            text: "Lecture 5 - NumPy for Array Operations"
          - href: "Lectures/Theme_2-Data_Engineering/Lecture_6-Pandas/Lecture_6-Pandas.ipynb"
            text: "Lecture 6 - Data Manipulation with Pandas"
          - href: "Lectures/Theme_2-Data_Engineering/Lecture_7-Matplotlib,_Seaborn/Lecture_7-Matplotlib,_Seaborn.ipynb"
            text: "Lecture 7 - Data Visualization with Matplotlib and Seaborn"
          - href: "Lectures/Theme_2-Data_Engineering/Lecture_8-SQL/Lecture_8-SQL.ipynb"
            text: "Lecture 8 - Databases and SQL"
          - href: "Lectures/Theme_2-Data_Engineering/Lecture_9-Data_Exploration/Lecture_9-Data_Exploration.ipynb"
            text: "Lecture 9 - Data Exploration and Preprocessing"
      - section: "Tutorials"
        contents:
          - href: "Lectures/Tutorials/Tutorial_1-Jupyter_Notebooks/Tutorial_1-Jupyter_Notebooks.ipynb"
            text: "Tutorial 1 - Jupyter Notebooks"
          - href: "Lectures/Tutorials/Tutorial_2-VS_Code/Tutorial_2-VS_Code.ipynb"
            text: "Tutorial 2 - Python IDEs, VS Code"
          - href: "Lectures/Tutorials/Tutorial_3-Terminal_and_Command_Line/Tutorial_3-Terminal_and_Command_Line.ipynb"
            text: "Tutorial 3 - Terminal and Command Line"
          - href: "Lectures/Tutorials/Tutorial_4-Virtual_Environments/Tutorial_4-Virtual_Environments.ipynb"
            text: "Tutorial 4 - Virtual Environments"
          - href: "Lectures/Tutorials/Tutorial_5-Google_Colab/Tutorial_5-Google_Colab.ipynb"
            text: "Tutorial 5 - Google Colab"
  page-footer:
    center: "CS 4622/5622 - Applied Data Science with Python, University of Idaho, Fall 2026"
    background: "#D9E3E4"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    mainfont: "Atkinson Hyperlegible"
    css: styles.css
    include-after-body: toc-arrows.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    grid:
      body-width: 1000px
      sidebar-width: 360px

# Notebooks are rendered from their saved outputs; never execute them during builds
execute:
  enabled: false
